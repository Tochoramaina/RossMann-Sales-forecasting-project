version: "3.8"

services:
   db:
     image: postgres:15
     environment:
        POSTGRES_USER: mlflow 
        POSTGRES_PASSWORD: mlflowpassword 
        POSTGRES_DB: mlflowdb 
     ports:
        - "5432:5432"
     
     mlflow:
        image: ghcr.io/mlflow/mlflow:v2.10.0 
        ports:
          - "5000:5000"
        command: >
           mlflow server 
           --backend-store-uri postgresql://mlflow:mlflowpassword@db:5432/mlflowdb
           --default-artifact-root /mlflow/artifacts
           --host 0.0.0.0 
        depends_on:
           - db 
     fastapi_app:
        build:
           context: .
           dockerfile: Dockerfile.api 
        ports: 
            - "8000:8000"
        depends_on:
            - mlflow 
      
     streamlit_app:
        build:
           context: .
           dockerfile: Dockerfile.streamlit 
        ports:
           - "8501:8501"
        depends_on:
           - fastapi_app

      